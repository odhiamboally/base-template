name: Mobile CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-windows:
    name: Mobile Android and Windows build
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore MAUI workloads
        run: dotnet workload restore src/Frontend/Mobile/BT.UI.Maui/BT.UI.Maui.csproj

      - name: Restore MAUI project
        run: dotnet restore src/Frontend/Mobile/BT.UI.Maui/BT.UI.Maui.csproj

      - name: Build Android
        run: dotnet build src/Frontend/Mobile/BT.UI.Maui/BT.UI.Maui.csproj --configuration Release --framework net10.0-android --no-restore

      - name: Build Windows
        run: dotnet build src/Frontend/Mobile/BT.UI.Maui/BT.UI.Maui.csproj --configuration Release --framework net10.0-windows10.0.19041.0 --no-restore

  apple:
    name: Mobile iOS and Mac Catalyst build
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore MAUI workloads
        run: dotnet workload restore src/Frontend/Mobile/BT.UI.Maui/BT.UI.Maui.csproj

      - name: Restore MAUI project
        run: dotnet restore src/Frontend/Mobile/BT.UI.Maui/BT.UI.Maui.csproj

      - name: Build iOS
        run: dotnet build src/Frontend/Mobile/BT.UI.Maui/BT.UI.Maui.csproj --configuration Release --framework net10.0-ios --no-restore

      - name: Build Mac Catalyst
        run: dotnet build src/Frontend/Mobile/BT.UI.Maui/BT.UI.Maui.csproj --configuration Release --framework net10.0-maccatalyst --no-restore
