name: Backend CI

on:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - "src/Backend/**"
      - "src/Shared/**"
      - "tests/BT.Tests.Unit/**"
      - "tests/BT.Tests.Integration/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "src/Backend/**"
      - "src/Shared/**"
      - "tests/BT.Tests.Unit/**"
      - "tests/BT.Tests.Integration/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore API
        run: dotnet restore src/Backend/Api/BT.Api/BT.Api.csproj

      - name: Restore unit tests
        run: dotnet restore tests/BT.Tests.Unit/BT.Tests.Unit.csproj

      - name: Restore integration tests
        run: dotnet restore tests/BT.Tests.Integration/BT.Tests.Integration.csproj

      - name: Build API
        run: dotnet build src/Backend/Api/BT.Api/BT.Api.csproj --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test tests/BT.Tests.Unit/BT.Tests.Unit.csproj --configuration Release --no-restore --logger trx

      - name: Run integration tests
        run: dotnet test tests/BT.Tests.Integration/BT.Tests.Integration.csproj --configuration Release --no-restore --logger trx
