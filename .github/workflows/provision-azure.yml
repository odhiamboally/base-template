name: Provision Azure Infrastructure

on:
  workflow_dispatch:
    inputs:
      deployment_target:
        description: "Deployment target (container-apps or app-service)"
        required: true
        default: "container-apps"
        type: choice
        options:
          - container-apps
          - app-service
      manage_container_apps:
        description: "Create or explicitly repair Container Apps (leave false for infrastructure-only reruns after deployment)"
        required: true
        default: false
        type: boolean
      recreate_failed_container_apps:
        description: "Delete only terminally failed Container Apps before an explicit repair. Never select for healthy apps."
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  provision:
    name: Provision Resources
    runs-on: ubuntu-latest
    environment: azure-prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Remove terminally failed Container Apps for explicit repair
        if: ${{ inputs.manage_container_apps && inputs.recreate_failed_container_apps }}
        shell: bash
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          RESOURCE_PREFIX: btprod
        run: |
          set -euo pipefail

          for app_name in "${RESOURCE_PREFIX}-api" "${RESOURCE_PREFIX}-ui"; do
            state="$(az containerapp show \
              --resource-group "${RESOURCE_GROUP}" \
              --name "${app_name}" \
              --query 'properties.provisioningState' \
              --output tsv 2>/dev/null || true)"

            if [[ "${state}" == "Failed" ]]; then
              echo "Deleting terminally failed Container App: ${app_name}"
              az containerapp delete \
                --resource-group "${RESOURCE_GROUP}" \
                --name "${app_name}" \
                --yes
            elif [[ -n "${state}" ]]; then
              echo "::error::${app_name} is '${state}', not 'Failed'. Refusing to delete a non-failed Container App."
              exit 1
            else
              echo "${app_name} does not exist; Bicep will create it."
            fi
          done

      - name: Run Bicep Deployment
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          subscriptionId: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ vars.AZURE_RESOURCE_GROUP }}
          template: ./ops/azure/main.bicep
          failOnStdErr: false
          parameters: >
            sqlAdministratorLogin="btadmin"
            sqlAdministratorLoginPassword="${{ secrets.AZURE_SQL_ADMIN_PASSWORD }}"
            deploymentTarget="${{ inputs.deployment_target }}"
            databaseProvider="${{ vars.DATABASE_PROVIDER || 'SqlServer' }}"
            azureCacheConnectionString="${{ secrets.AZURE_REDIS_CONNECTION_STRING }}"
            manageContainerApps=${{ inputs.manage_container_apps }}
            resourcePrefix="btprod"
