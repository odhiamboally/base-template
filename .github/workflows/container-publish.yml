name: Container Publish

on:
  workflow_dispatch:
    inputs:
      publish_images:
        description: "Push images to GHCR"
        required: true
        default: false
        type: boolean
  pull_request:
    branches: [main]
    paths:
      - "ops/docker/**"
      - "src/Backend/**"
      - "src/Frontend/Web/**"
      - "src/Frontend/Shared/**"
      - "src/Shared/**"
      - ".dockerignore"
      - ".github/workflows/container-publish.yml"
  push:
    branches: [main]
    paths:
      - "ops/docker/**"
      - "src/Backend/**"
      - "src/Frontend/Web/**"
      - "src/Frontend/Shared/**"
      - "src/Shared/**"
      - ".dockerignore"
      - ".github/workflows/container-publish.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.service }} image
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      REGISTRY: ghcr.io
      IMAGE_NAMESPACE: ${{ github.repository_owner }}
      SHOULD_PUSH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_images) }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            image: base-template-api
            dockerfile: ops/docker/api.Dockerfile
          - service: blazor
            image: base-template-blazor
            dockerfile: ops/docker/blazor.Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: env.SHOULD_PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and optionally push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ env.SHOULD_PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
