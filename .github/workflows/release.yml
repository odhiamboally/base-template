name: Release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment name"
        required: true
        default: "production"

permissions:
  contents: read

jobs:
  package-api:
    name: Package API
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore API
        run: dotnet restore src/Backend/Api/BT.Api/BT.Api.csproj

      - name: Publish API
        run: dotnet publish src/Backend/Api/BT.Api/BT.Api.csproj --configuration Release --no-restore --output artifacts/api

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: bt-api-${{ inputs.environment }}
          path: artifacts/api
