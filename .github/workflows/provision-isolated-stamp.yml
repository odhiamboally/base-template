name: Provision Isolated Stamp

on:
  workflow_dispatch:
    inputs:
      stamp_id:
        description: "The unique ID for the stamp (used as resource prefix)"
        required: true
        type: string
      resource_group:
        description: "The target resource group name"
        required: true
        type: string
      database_provider:
        description: "Database provider (SqlServer or PostgreSql)"
        required: true
        default: "PostgreSql"
        type: choice
        options:
          - SqlServer
          - PostgreSql

permissions:
  contents: read
  id-token: write

jobs:
  provision:
    name: Provision Isolated Stamp Resources
    runs-on: ubuntu-latest
    environment: azure-prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Resource Group Exists
        shell: bash
        run: |
          az group create --name "${{ inputs.resource_group }}" --location "${{ vars.AZURE_REGION || 'eastus' }}"

      - name: Run Bicep Deployment
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          subscriptionId: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ inputs.resource_group }}
          template: ./ops/azure/stamp-isolated/main.bicep
          failOnStdErr: false
          parameters: >
            sqlAdministratorLogin="btadmin"
            sqlAdministratorLoginPassword="${{ secrets.AZURE_SQL_ADMIN_PASSWORD }}"
            databaseProvider="${{ inputs.database_provider }}"
            resourcePrefix="${{ inputs.stamp_id }}"
