name: Architecture Guardrails

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  architecture:
    name: Build and architecture tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore BaseTemplate.slnx

      - name: Build API
        run: dotnet build src/Backend/Api/BT.Api/BT.Api.csproj --configuration Release --no-restore

      - name: Run architecture tests
        run: dotnet test tests/BT.Tests.Architecture/BT.Tests.Architecture.csproj --configuration Release --no-restore --logger trx
